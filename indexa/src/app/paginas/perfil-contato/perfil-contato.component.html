<app-container>
  <app-cabecalho [telaInicial]="false" [bannerSrc]="'/assets/perfil-contato.png'" [titulo]="'Perfil do Contato'"></app-cabecalho>

  <section class="perfil">
    <div class="imagem-perfil">
      <img [src]="contato.avatar" alt="Avatar do contato">
      <h2><strong>{{contato.nome}}</strong></h2>
    </div>
    <app-separador></app-separador>
    <ul>
      <li>
        <i class="material-icons">call</i>
        <strong>Telefone</strong>
      </li>
      <li>{{ contato.telefone }}</li>
      <li>
        <i class="material-icons">mail</i>
        <strong>Email</strong>
      </li>
      <li>{{ contato.email }}</li>
      <li>
        <i class="material-icons">calendar_today</i>
        <strong>Data de nascimento</strong>
      </li>
      <li>{{ contato.aniversario }}</li>
      <li>
        <i class="material-icons">language</i>
        <strong>Redes sociais</strong>
      </li>
      <li>{{ contato.redes }}</li>
    </ul>
    <div class="botoes">
      <button class="botao-excluir" (click)="ExcluirContato()">Excluir contato</button>
      <button  [routerLink]="['/formulario-contato', contato.id]" class="botao-editar">Editar</button>
    </div>
  </section>
</app-container>
