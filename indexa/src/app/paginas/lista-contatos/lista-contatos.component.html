<app-container>
  <app-cabecalho [telaInicial]="true" [bannerSrc]="'assets/banner.png'" [titulo]="'Organize, <span>conecte,</span> simplifique'"> </app-cabecalho>

  <input type="search" placeholder="Digite para buscar" [(ngModel)] = "filtroPorTexto"/> <!-- ngmodel faz o binding bidirecional entre o input e a variável -->

  <section class="adicionar-contato">
    <button routerLink="/formulario-contato">
      <img src="../../../assets/plus.png" alt="Adicionar contato">
      <span>Adicionar contato</span>
    </button>
  </section>

  @for (letra of alfabeto; track letra) { <!-- track rastreia os elementos do array, evitando que o Angular recrie os elementos do DOM a cada mudança no array. Isso melhora a performance da aplicação. -->
    <app-separador> 
      {{letra}} 
    </app-separador>
    @for (contato of filtrarContatosPorLetra(letra); track contato.id){
      <app-contato [nome]="contato.nome" [telefone]="contato.telefone" [id]="contato.id!" [avatar]="contato.avatar"> </app-contato>  <!-- [] serve para passar valores dinâmicos para as propriedades do componente -->
    } 
  }
</app-container>
