<section class="contato">
    <ul>
        <img [src]="avatar" alt="avatar" class="avatar" [routerLink]="['/perfil-contato', id]">
        <li>
            <strong>{{ nome }}</strong>
        </li>
        <li>{{ telefone }}</li>
        <li>
            <button [routerLink]="['/formulario-contato', id]"> <!-- passa o id dinamicamente-->
                <img src="/assets/pencil-square.png" alt="Editar">
            </button>
            <button [routerLink]="['/perfil-contato', id]">
                <img src="/assets/trash.png" alt="Excluir">
            </button>

        </li>
    </ul>
</section>
