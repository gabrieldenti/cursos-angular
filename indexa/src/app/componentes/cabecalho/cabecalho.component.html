<header class="cabecalho">
    <img src="assets/logo.png" alt="Logo da Indexa">
    @if(!telaInicial){
        <div class="link">
        <button>
          <img class="seta" src="../../../assets/arrow-left.png" alt="Seta para voltar"/>
          <a routerLink="/lista-contatos">Voltar</a>
        </button>
      </div>
    }
    <img [src]="bannerSrc" class="banner" alt="Banner da Indexa">
    <h1  [ngClass]="telaInicial ? 'titulo' : 'titulo-form'" [innerHTML]="titulo"></h1>
</header>
