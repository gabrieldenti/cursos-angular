<section class="container">
    <header class="header d-flex">
        <h2 class="ff-inter">Meu Mural</h2>
        <button routerLink="/criarPensamento" class="botao">Adicionar Pensamento</button>
    </header>
    <div class="mural">
        <div>
            @for (pensamentos of listaPensamentos; track pensamentos) {
            <app-pensamentos-pensamento [pensamento]="pensamentos"></app-pensamentos-pensamento> <!-- property binding de pensamento recebe o (pensamentos)valor de listaPensamentos -->
            }
        </div>
    </div>
</section>
