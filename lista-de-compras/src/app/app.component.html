<section class="main">
  <app-input [itemEditado]="itemEditado">
  </app-input>
  <div class="container">
    <div class="lista">
      <h4 class="title-list">Lista de Compras</h4>
      <div *ngIf="listaDeCompras.length !== 0 else naoTemItem">
        <div *ngFor="let item of listaDeCompras">
          <app-item [item]="item" (itemEditar)="editarItem($event)"
          (itemExcluir)="excluirItem($event)"></app-item>
        </div>
      </div>
      <ng-template #naoTemItem>
        <small>Não tem itens para mostrar, adicione um item na lista!</small>
      </ng-template>
    </div>
  </div>
</section>
